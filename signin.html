<!-- Sign In -->
<!DOCTYPE html>
<html lang="pt-BR">
<!-- Head -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Links -->
        <!-- JS -->
    <script type="module" src="./signin.js" defer></script>
    <script src="./pwa.js" defer></script>
        <!-- CSS -->
    <link rel="stylesheet" href="./signin.css">
        <!-- Fonte -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
        <!-- Icon -->
    <link rel="icon" href="./icons/icon-192.png">
        <!-- FontAwesome -->
    <script src="https://kit.fontawesome.com/c95e6303ed.js" crossorigin="anonymous"></script>
        <!-- PWA -->
        <link rel="manifest" href="./manifest.json">
        <meta name="theme-color" content="#ff0000">
        <link rel="apple-touch-icon" href="./icons/icon-192.png">
    <!-- Título -->
    <title>Sign In - Evil Spotify</title>
</head>
<!-- Body -->
<body>
    <!-- Main -->
    <main>
        <div id="mainDiv">
            <img src="./icons/icon-512.png" alt="Logo">
            <h1>Crie uma conta.</h1>
                <!-- Formulário -->
                <form id="signInForm">
                    <!-- Email -->
                    <div class="signInEntry">
                        <label for="email">Email</label>
                        <input type="email" name="email" id="email" placeholder="Digite seu email" class="signInInput" required>
                    </div>
                    <!-- Senha -->
                    <div class="signInEntry">
                        <label for="password">Senha</label>
                        <div class="passwordDiv">
                            <input type="password" id="password" placeholder="Digite sua senha" class="signInInput" name="password" required>
                        </div>
                    </div>
                    <!-- Confimar senha -->
                    <div class="signInEntry">
                        <label for="confirmPassword">Confirmar senha</label>
                        <div class="passwordDiv">
                            <input type="password" id="confirmPassword" placeholder="Confirme sua senha" class="signInInput" name="confirmPassword" required>
                        </div>
                    </div>
                    <!-- Submit -->
                    <button href="./index.html" id="submit">Entrar</button>
                </form>
            <!-- Entrar com conta -->
            <div id="logInDiv">
                <p>Já possui uma conta?</p>
                <a href="./index.html" id="logInLink">Entrar com conta</a>
            </div>
        </div>
    </main>
</body>
</html>
